<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout — Glow &amp; Scent</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary:     #7b5e57;
      --accent:      #5e443e;
      --secondary:   #fffaf5;
      --gold:        #c9963a;
      --glass:       rgba(255,255,255,0.80);
      --shadow:      0 8px 28px rgba(0,0,0,0.10);
      --radius:      16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Open Sans', sans-serif; background: var(--secondary); color: #3b2f2f; }
    a { text-decoration: none; color: inherit; }

    /* Navbar */
    nav {
      position: sticky; top: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 2rem;
      background: rgba(255,250,245,0.88);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      width: min(1200px, calc(100vw - 24px));
      margin: 10px auto 0;
      border-radius: 16px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: bold; color: #3b2f2f; }
    .nav-back { display: flex; align-items: center; gap: 6px; color: var(--primary); font-weight: 600; font-size: 0.95rem; }

    /* Progress bar */
    .progress-bar { background: white; padding: 1rem 2rem; border-bottom: 1px solid rgba(123,94,87,0.12); display: flex; justify-content: center; }
    .progress-step { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; color: #bbb; }
    .progress-step.done { color: #1e7a3a; }
    .progress-step.active { color: var(--primary); }
    .progress-step .dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #eee; }
    .progress-step.active .dot { background: var(--primary); color: white; }
    .progress-line { width: 40px; height: 2px; background: #eee; align-self: center; margin: 0 0.3rem; }
    .progress-line.done { background: #1e7a3a; }

    /* Layout */
    .checkout-layout { max-width: 1000px; margin: 2rem auto; padding: 0 1.2rem; display: grid; grid-template-columns: 1fr 380px; gap: 1.8rem; }
    @media (max-width: 800px) { .checkout-layout { grid-template-columns: 1fr; } }

    .card { background: var(--glass); backdrop-filter: blur(10px); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.8rem; margin-bottom: 1.4rem; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent); margin-bottom: 1.4rem; display: flex; align-items: center; gap: 0.6rem; }

    .field-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .field-group label { font-size: 0.78rem; font-weight: 600; color: #9a7a70; }
    .field-group input, .field-group textarea { padding: 0.8rem 1rem; border: 1.5px solid rgba(123,94,87,0.2); border-radius: 10px; }
    .field-group.has-error input { border-color: #c0392b; }
    .field-error { font-size: 0.78rem; color: #c0392b; display: none; }
    .field-group.has-error .field-error { display: block; }

    .summary-item { display: flex; align-items: center; gap: 0.9rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(123,94,87,0.1); }
    .summary-item img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
    .summary-total { margin-top: 1.2rem; padding-top: 1rem; border-top: 2px solid rgba(123,94,87,0.15); display: flex; justify-content: space-between; }
    .summary-total .amount { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--accent); font-weight: 600; }

    .place-order-btn { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

    /* Modal */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 5000; align-items: center; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal { background: white; border-radius: 20px; max-width: 480px; width: 100%; padding: 2rem; text-align: center; }
    #qrcode { display: flex; justify-content: center; margin: 1rem 0; }
    .upi-apps { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .upi-app-btn { display: flex; flex-direction: column; align-items: center; padding: 0.7rem; border: 1.5px solid #eee; border-radius: 10px; width: 80px; font-size: 0.75rem; }
    .upi-app-btn img { width: 30px; height: 30px; margin-bottom: 4px; }
    .wa-btn { display: flex; align-items: center; justify-content: center; gap: 0.6rem; width: 100%; padding: 0.85rem; background: #25D366; color: white; border-radius: 12px; margin-bottom: 1rem; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #3b2f2f; color: white; padding: 0.75rem 1.8rem; border-radius: 30px; z-index: 9999; transition: transform 0.35s; }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Glow &amp; Scent</a>
    <a href="cart.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Cart</a>
  </nav>

  <div class="progress-bar">
    <div class="progress-step done"><div class="dot">✓</div>Cart</div>
    <div class="progress-line done"></div>
    <div class="progress-step active" id="p-step-2"><div class="dot">2</div>Checkout</div>
    <div class="progress-line" id="p-line-2"></div>
    <div class="progress-step" id="p-step-3"><div class="dot">3</div>Payment</div>
  </div>

  <div class="checkout-layout" id="checkoutLayout">
    <div class="checkout-form">
      <div class="card">
        <div class="card-title"><i class="fas fa-user"></i> Delivery Details</div>
        <div class="field-group" id="fg-name">
          <label>Full Name *</label>
          <input type="text" id="inp-name" placeholder="Priya Sharma" />
          <span class="field-error">Name is required.</span>
        </div>
        <div class="field-group" id="fg-phone">
          <label>WhatsApp / Phone *</label>
          <input type="tel" id="inp-phone" placeholder="91XXXXXXXXXX" />
          <span class="field-error">Enter valid 10-digit number.</span>
        </div>
        <div class="field-group" id="fg-address">
          <label>Address *</label>
          <textarea id="inp-address" placeholder="House no, Street, City, Pincode"></textarea>
          <span class="field-error">Address is required.</span>
        </div>
      </div>
    </div>

    <div class="order-summary-card">
      <div class="card">
        <div class="card-title"><i class="fas fa-receipt"></i> Summary</div>
        <div id="summaryItems"></div>
        <div class="summary-total">
          <span>Total</span>
          <span class="amount" id="summaryTotal">₹0.00</span>
        </div>
        <button class="place-order-btn" id="placeOrderBtn" onclick="placeOrder()">Place Order & Pay</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="paymentModal">
    <div class="modal">
      <h2>Pay via UPI</h2>
      <div id="modalOrderId" style="font-weight:bold; color:#7b5e57; margin:10px 0;"></div>
      <div id="qrcode"></div>
      <h1 id="modalAmount" style="margin:10px 0;">₹0.00</h1>
      <div class="upi-apps" id="upiAppBtns"></div>
      <a class="wa-btn" id="waBtn" href="#" target="_blank"><i class="fab fa-whatsapp"></i> Confirm on WhatsApp</a>
      <button class="place-order-btn" onclick="orderDone()" style="background:#eee; color:#333;">I've Paid — Done</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="cart.js"></script>

  <script>
//   const MERCHANT_UPI  = '...'; // Not needed as server provides this
    //   const MERCHANT_NAME = '...'; 


    document.addEventListener('DOMContentLoaded', () => {
      const cart = getCart();
      if (!cart || cart.length === 0) {
        alert("Your cart is empty!");
        window.location.href = 'index.html';
        return;
      }
      renderSummary(cart);
    });

    function renderSummary(cart) {
      let total = 0;
      let html = '';
      cart.forEach(item => {
        const qty = parseInt(item.qty) || 1;
        const price = parseFloat(item.price) || 0;
        total += (qty * price);
        html += `<div class="summary-item">
          <img src="${item.image || ''}" onerror="this.src='https://via.placeholder.com/50'">
          <div style="flex:1;"><b>${item.name}</b><br><small>Qty: ${qty}</small></div>
          <div>₹${(qty * price).toFixed(2)}</div>
        </div>`;
      });
      document.getElementById('summaryItems').innerHTML = html;
      document.getElementById('summaryTotal').textContent = '₹' + total.toFixed(2);
      return total;
    }

    function validate() {
      // Clear previous errors
      document.querySelectorAll('.field-group').forEach(el => el.classList.remove('has-error'));

      const n = document.getElementById('inp-name').value.trim();
      const p = document.getElementById('inp-phone').value.trim();
      const a = document.getElementById('inp-address').value.trim();
      let ok = true;
      if(!n){ document.getElementById('fg-name').classList.add('has-error'); ok=false; }
      if(p.length < 10){ document.getElementById('fg-phone').classList.add('has-error'); ok=false; }
      if(!a){ document.getElementById('fg-address').classList.add('has-error'); ok=false; }
      return ok;
    }

    let currentOrder = null;

    async function placeOrder() {
      if (!validate()) return;
      
      const btn = document.getElementById('placeOrderBtn');
      const originalText = btn.textContent;
      
      const cart = getCart();
      const user = {
        name: document.getElementById('inp-name').value.trim(),
        phone: document.getElementById('inp-phone').value.trim(),
        address: document.getElementById('inp-address').value.trim()
      };

      try {
        // Disable button & show loading
        btn.disabled = true;
        btn.textContent = "Processing order...";

        const response = await fetch(`${API_BASE}/api/create-order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cart, user })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Failed to create order');
        }

        const data = await response.json();
        currentOrder = data;

        // Update Modal
        document.getElementById('modalOrderId').textContent = "Order ID: " + data.orderId;
        document.getElementById('modalAmount').textContent = "₹" + data.amount.toFixed(2);
        
        // QR Code
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), { text: data.upiUri, width: 150, height: 150 });

        // UPI App Links - Simplified to use standard protocol
        const apps = [
          { name: 'GPay', icon: 'https://cdn.worldvectorlogo.com/logos/google-pay-2.svg' },
          { name: 'PhonePe', icon: 'https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/phonepe-logo-icon.png' },
          { name: 'Paytm', icon: 'https://img.icons8.com/color/48/000000/paytm.png' }
        ];

        document.getElementById('upiAppBtns').innerHTML = apps.map(app => `
          <a class="upi-app-btn" href="${data.upiUri}">
            <img src="${app.icon}">
            ${app.name}
          </a>`).join('');

        // WhatsApp
        document.getElementById('waBtn').href = data.whatsappLink;

        // Show Modal & UI Progress
        document.getElementById('paymentModal').classList.add('open');
        document.getElementById('p-step-2').classList.replace('active', 'done');
        document.getElementById('p-line-2').classList.add('done');
        document.getElementById('p-step-3').classList.add('active');

      } catch (err) {
        console.error(err);
        alert(err.message || "Error creating order. Please try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function orderDone() {
      if (currentOrder) {
        sessionStorage.setItem('lastOrderId', currentOrder.orderId);
        sessionStorage.setItem('lastAmount', currentOrder.amount);
      }
      localStorage.removeItem('cart');
      window.location.href = 'order.html';
    }
  </script>
</body>
</html>
